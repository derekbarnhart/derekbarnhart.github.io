<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 2rem; }
      section { margin-bottom: 2rem; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      h2 { font-size: 1.125rem; margin: 1rem 0 0.5rem; }
      code { background: color-mix(in hsl, Canvas, CanvasText 10%); padding: 0.125rem 0.375rem; border-radius: 4px; }
      .note { opacity: 0.7; }
    </style>
    <script type="module">
      // Toggle ?build=dist to load from dist/
      const params = new URLSearchParams(location.search);
      const useDist = params.get('build') === 'dist';
      const rel = useDist ? '../dist/loader.js' : '../src/loader.js';
      import(rel);
    </script>
  </head>
  <body>
    <h1>Components Demo</h1>
    <p class="note">Load <code>?build=dist</code> to import from <code>dist/</code>.</p>

    <section>
      <h2>db-badge variants</h2>
      <div class="row">
        <db-badge>Default</db-badge>
        <db-badge variant="soft" color="blue">Soft Blue</db-badge>
        <db-badge variant="solid" color="green">Solid Green</db-badge>
        <db-badge variant="outline" color="red">Outline Red</db-badge>
      </div>
    </section>

    <section>
      <h2>db-badge sizes</h2>
      <div class="row">
        <db-badge size="sm" color="purple">Small</db-badge>
        <db-badge size="md" color="purple">Medium</db-badge>
        <db-badge size="lg" color="purple">Large</db-badge>
      </div>
    </section>

    <section>
      <h2>db-badge custom content</h2>
      <div class="row">
        <db-badge variant="solid" color="yellow">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.803 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.803-2.034a1 1 0 00-1.175 0l-2.803 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81H7.03a1 1 0 00.95-.69l1.07-3.292z"/></svg>
          Starred
        </db-badge>
      </div>
    </section>

    <section>
      <h2>db-time-ring examples</h2>
      <div class="row">
        <!-- 3-minute countdown with 30s chunks -->
        <db-time-ring duration="180" mode="countdown" chunk-size="30" pulse-on-chunk label="remaining" autoplay></db-time-ring>

        <!-- 25-minute Pomodoro with default 5-min chunks -->
        <db-time-ring duration="1500" mode="countdown" label="remaining" warn-threshold="0.2" danger-threshold="0.1" autoplay></db-time-ring>

        <!-- Anchored to a time 2 minutes from now -->
        <db-time-ring id="anchored" label="remaining"></db-time-ring>
        <script type="module">
          const a = document.getElementById('anchored');
          const end = new Date(Date.now() + 2 * 60 * 1000).toISOString();
          a.setAttribute('end-time', end);
          a.setAttribute('duration', '120');
        </script>
      </div>
    </section>
  </body>
  </html>
