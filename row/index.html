<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebXR Rower (Mock)</title>
    <script type="module" crossorigin src="/assets/index-z2aZ0xwK.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias: true; colorManagement: true" vr-mode-ui="enabled: true" background="color: #202532" fog="type: linear; color: #0b0f1a; near: 5; far: 120">
      <a-entity id="rig" rail-motion="rail: #rail; height: 1.6">
        <a-entity id="camera" camera look-controls wasd-controls-enabled="false">
          <!-- Debug metrics overlay (optional) -->
          <a-entity id="debugOverlay" position="-0.6 0.5 -1.2" debug-overlay="visible: false"></a-entity>
        </a-entity>
        <a-entity id="rightHand" laser-controls="hand: right" cursor="rayOrigin: entity" raycaster="objects: .ui-interactive"></a-entity>
      </a-entity>

      <!-- Closed-loop rail with alternating segment colors -->
      <a-entity id="rail" path-rail="type: ellipse; radius: 50; rx: 60; rz: 40; segmentLength: 5; width: 12; gap: 0.08; elevation: 0.02; edgeWidth: 0.2; edgeColor: #ffffff; colorA: #0e2a6b; colorB: #3b7bdc"></a-entity>

      <!-- Simple lights to improve contrast -->
      <a-entity light="type: ambient; color: #777"></a-entity>
      <a-entity light="type: directional; color: #fff; intensity: 0.6" position="1 2 0"></a-entity>
      <a-sky color="#0b0f1a"></a-sky>

      

      <!-- Mock rower component producer -->
      <a-entity mock-rower="enabled: true"></a-entity>
    </a-scene>

  </body>
  </html>
